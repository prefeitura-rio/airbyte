documentationUrl: https://docs.airbyte.com/integrations/sources/typesense
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Typesense Spec
  type: object
  required:
    - host
    - api_key
  properties:
    protocol:
      type: string
      description: The protocol to use for connecting to Typesense.
      enum:
        - http
        - https
      default: http
      examples:
        - http
        - https
    host:
      type: string
      description: The Typesense host (hostname or IP address, without protocol or port).
      examples:
        - localhost
        - typesense.example.com
        - 192.168.1.100
    port:
      type: integer
      description: The Typesense port.
      minimum: 1
      maximum: 65535
      default: 8108
      examples:
        - 8108
        - 443
    api_key:
      type: string
      description: The Typesense API key for authentication.
      airbyte_secret: true
    page_size:
      type: integer
      description: The number of documents to fetch per page during export.
      minimum: 1
      maximum: 250
      default: 250
      examples:
        - 100
        - 250
